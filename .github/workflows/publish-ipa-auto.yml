name: Publish IPA

# Republishes a CarPlay IPA build as a public Release asset.
#
# Why: artifact downloads redirect to pipelines.actions.githubusercontent.com,
# which is unreachable on this network, while release assets are served from
# objects.githubusercontent.com, which works.
#
# Triggers automatically when "CarPlay IPA" finishes successfully.

on:
  workflow_run:
    workflows: ["CarPlay IPA"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve run id
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            ID="${{ github.event.workflow_run.id }}"
          else
            ID=$(gh run list -R "${{ github.repository }}" --workflow carplay-ipa.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "resolved run id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh run download "${{ steps.r.outputs.id }}" -R "${{ github.repository }}" -n coda-carplay-ipa -D out
          echo "--- files ---"
          find out -type f -exec ls -lh {} \;

      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="carplay-ipa-latest"
          gh release delete "$TAG" -R "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/*.ipa \
            -R "${{ github.repository }}" \
            --title "Coda CarPlay IPA" \
            --notes "CarPlay-enabled IPA, ad-hoc signed with com.apple.developer.carplay-audio. Built from run ${{ steps.r.outputs.id }}. Install with TrollStore."
          echo "--- assets ---"
          gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
