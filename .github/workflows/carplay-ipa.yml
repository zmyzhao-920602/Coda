name: CarPlay IPA

# Builds the iOS IPA. CarPlay template support is deliberately NOT enabled in this
# build: on iOS 16.5 the template session is silently dropped (setRootTemplate's
# completion never fires) for an ad-hoc / TrollStore signature, which surfaces as a
# black screen when the CarPlay icon is tapped. The Now Playing experience on the
# head unit comes from MPNowPlayingInfoCenter and does not need the CarPlay scene.
#
# Version resolution only considers v* tags: publishing helper releases such as
# "carplay-ipa-latest" must never leak into CFBundleShortVersionString, or the
# in-app update check compares "0.1.2" against a non-numeric string and loops.

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (leave empty to use the latest v* tag)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION}"
          if [ -z "$V" ]; then
            V="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')"
          fi
          [ -n "$V" ] || V="0.1.2"
          B="$(git rev-list --count HEAD 2>/dev/null || echo 1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V BUILD=$B"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/CodaIOS.xcworkspace \
            -scheme CodaIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.v.outputs.build }}" \
            build 2>&1 | tee build-xcodebuild.log | tail -n 40

      - name: Package IPA
        run: |
          APP="$(ls -d build/dd/Build/Products/Release-iphoneos/*.app | head -n 1)"
          V="${{ steps.v.outputs.version }}"
          mkdir -p out/payload/Payload
          ditto "$APP" "out/payload/Payload/$(basename "$APP")"
          ( cd out/payload && zip -qry -X "../Coda-iOS-$V.ipa" Payload )
          ls -lh out/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UISupportsCarPlay' "$APP/Info.plist" || echo "no CarPlay key (expected)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: coda-carplay-ipa
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-xcodebuild.log
          if-no-files-found: ignore
